name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned so the runner caches the binary, and so CI runs the same
          # Bun the project is developed against.
          bun-version: 1.3.14

      # setup-bun caches the Bun binary, not the packages it downloads.
      - name: Cache package downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # tests/setup.ts points config at a throwaway database and image
      # directory, so no .env is needed here.
      - name: Unit tests
        run: bun run test

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache package downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-cache-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Everything, including low and moderate, for the log. Never fails the
      # job — the gate is the step below it.
      - name: Full advisory report
        run: bun audit || true

      - name: Fail on high or critical advisories
        run: bun audit --audit-level=high
